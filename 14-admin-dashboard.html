<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | ZOROUFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6FB; --bg-soft:#FFFFFF; --ink:#2B2A33; --ink-soft:#6B6875;
    --violet:#8B6CF2; --blue:#4E9CFF; --teal:#3EE0C4;
    --glass:rgba(0,0,0,0.04); --glass-border:rgba(0,0,0,0.1);
    --line:rgba(0,0,0,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  a{text-decoration:none;color:inherit;} button{font-family:inherit;border:none;background:none;cursor:pointer;} input,select,textarea{font-family:inherit;}

  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);}
  .topbar{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;}
  .logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--blue));}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .topbar-right a{font-size:13px;color:var(--ink-soft);}
  .logout-btn{padding:9px 18px;border-radius:100px;font-size:12.5px;font-weight:700;background:var(--glass);border:1px solid var(--glass-border);color:var(--ink);}
  .logout-btn:hover{background:rgba(255,255,255,0.09);}

  .wrap{max-width:1280px;margin:0 auto;padding:32px;}
  .tabs{display:flex;gap:8px;margin-bottom:28px;border-bottom:1px solid var(--line);}
  .tab-btn{padding:12px 20px;font-size:14px;font-weight:700;color:var(--ink-soft);border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--blue);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .panel-head h2{font-size:18px;font-weight:800;}
  .add-btn{padding:11px 22px;border-radius:12px;font-size:13.5px;font-weight:800;color:#08080A;background:linear-gradient(100deg,var(--teal),var(--blue));}
  .add-btn:hover{opacity:0.92;}

  table{width:100%;border-collapse:collapse;background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;overflow:hidden;}
  thead th{text-align:right;font-size:12px;font-weight:700;color:var(--ink-soft);padding:14px 16px;border-bottom:1px solid var(--line);}
  tbody td{padding:14px 16px;font-size:13.5px;border-bottom:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  .row-actions{display:flex;gap:8px;}
  .icon-action{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);color:var(--ink-soft);transition:all .2s;}
  .icon-action:hover{color:var(--ink);border-color:rgba(255,255,255,0.28);}
  .icon-action.danger:hover{color:#FF6B81;border-color:rgba(255,107,129,0.4);}
  .price-cell strong{display:block;}
  .price-cell del{font-size:11.5px;color:var(--ink-soft);}
  .status-select{padding:7px 10px;border-radius:8px;border:1px solid var(--glass-border);background:var(--bg-soft);color:var(--ink);font-size:12.5px;outline:none;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:13.5px;}
  .loading-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13.5px;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-box{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--bg-soft);border:1px solid var(--glass-border);border-radius:20px;padding:28px;}
  .modal-box h3{font-size:16px;font-weight:800;margin-bottom:22px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-field{margin-bottom:14px;}
  .form-field.full{grid-column:1/-1;}
  .form-field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;}
  .form-field input,.form-field select,.form-field textarea{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.04);color:var(--ink);font-size:13.5px;outline:none;transition:border-color .2s;}
  .form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--blue);}
  .form-field textarea{resize:vertical;min-height:80px;}
  .modal-actions{display:flex;gap:10px;margin-top:8px;}
  .modal-actions button{flex:1;padding:13px;border-radius:12px;font-size:13.5px;font-weight:700;}
  .modal-save{color:#08080A;background:linear-gradient(100deg,var(--teal),var(--blue));}
  .modal-cancel{background:var(--glass);border:1px solid var(--glass-border);color:var(--ink);}
  .modal-err{font-size:12.5px;color:#FF6B81;margin-top:10px;display:none;}
  .modal-err.show{display:block;}

  @media(max-width:700px){
    .wrap{padding:20px;} table{display:block;overflow-x:auto;white-space:nowrap;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="logo"><span class="logo-dot"></span> ZOROUFE ادمین</div>
    <div class="topbar-right">
      <a href="index.html">مشاهده‌ی سایت</a>
      <button class="logout-btn" id="logoutBtn">خروج</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" data-tab="products">محصولات</button>
    <button class="tab-btn" data-tab="orders">سفارش‌ها</button>
<button class="tab-btn" data-tab="messages">پیام‌های تماس</button>
    <button class="tab-btn" data-tab="settings">تنظیمات سایت</button>
  </div>

  <!-- ---------- تب محصولات ---------- -->
  <div class="tab-panel active" id="panel-products">
    <div class="panel-head">
      <h2>مدیریت محصولات</h2>
      <button class="add-btn" id="openAddProduct">+ افزودن محصول</button>
    </div>
    <div id="productsTableWrap"><p class="loading-state">در حال بارگذاری...</p></div>
  </div>

  <!-- ---------- تب سفارش‌ها ---------- -->
  <div class="tab-panel" id="panel-orders">
    <div class="panel-head"><h2>مدیریت سفارش‌ها</h2></div>
    <div id="ordersTableWrap"><p class="loading-state">در حال بارگذاری...</p></div>
  </div>
  <!-- ---------- تب پیام‌های تماس ---------- -->
  <div class="tab-panel" id="panel-messages">
    <div class="panel-head"><h2>پیام‌های فرم تماس</h2></div>
    <div id="messagesWrap"><p class="loading-state">در حال بارگذاری...</p></div>
  </div>
  <!-- ---------- تب تنظیمات سایت ---------- -->
  <div class="tab-panel" id="panel-settings">
    <div class="panel-head"><h2>تنظیمات سایت</h2></div>
    <div style="max-width:520px;background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:24px;">
      <label style="display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:10px;">عکس پس‌زمینه‌ی هیرو (صفحه‌ی اصلی)</label>
      <p style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">هر وقت خواستی (مثلاً برای مناسبت‌ها) می‌تونی این عکس رو عوض کنی.</p>
      <img id="heroPreview" style="display:none;width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:14px;">
      <input type="file" id="heroImageInput" accept="image/*" style="margin-bottom:14px;">
      <div style="display:flex;gap:10px;">
        <button id="saveHeroBtn" class="add-btn" style="flex:1;">ذخیره‌ی عکس هیرو</button>
        <button id="removeHeroBtn" class="icon-action" style="width:auto;padding:0 16px;color:#FF6B81;">حذف عکس</button>
      </div>
      <p id="heroSettingsMsg" style="font-size:12.5px;color:var(--teal);margin-top:12px;display:none;"></p>
    </div>
  </div>
</div>

<!-- ---------- مودال افزودن/ویرایش محصول ---------- -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <h3 id="modalTitle">افزودن محصول جدید</h3>
    <form id="productForm">
      <div class="form-grid">
        <div class="form-field full"><label>نام محصول</label><input type="text" id="fName" required></div>
      <div class="form-field full">
  <label>عکس‌های محصول (می‌تونی چندتا با هم انتخاب کنی)</label>
  <input type="file" id="fImage" accept="image/*" multiple>
  <div id="imgPreviewWrap" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;"></div>
</div>
        <div class="form-field"><label>دسته‌بندی</label>
          <select id="fCategory" required>
            <option value="kitchen">ظروف و آشپزخانه</option>
            <option value="decor">دکوراسیون</option>
            <option value="lighting">نور و روشنایی</option>
            <option value="cleaning">نظافت خانه</option>
          </select>
        </div>
        <div class="form-field"><label>زیردسته</label><input type="text" id="fSubcategory" placeholder="مثال: ظروف چینی و سرامیک" required></div>

        <div class="form-field"><label>برند (اختیاری)</label><input type="text" id="fBrand"></div>
        <div class="form-field"><label>قیمت (تومان)</label><input type="number" id="fPrice" min="0" required></div>

        <div class="form-field full"><label>قیمت قبل از تخفیف (اختیاری)</label><input type="number" id="fOldPrice" min="0"></div>
        <div class="form-field full"><label>توضیحات</label><textarea id="fDescription"></textarea></div>
        <div class="form-field full">
          <label>مشخصات فنی (هر خط: کلید: مقدار)</label>
          <textarea id="fSpecs" placeholder="جنس: چینی درجه یک&#10;وزن: ۲ کیلوگرم&#10;تعداد قطعات: ۱۲"></textarea>
        </div>
       <div class="form-field full">
          <label>رنگ‌های موجود (اختیاری، با کاما جدا کن — اگه خالی بذاری گزینه‌ی رنگ نشون داده نمی‌شه)</label>
          <input type="text" id="fColors" placeholder="مثال: قرمز, آبی, سبز">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" id="cancelModal">انصراف</button>
        <button type="submit" class="modal-save" id="saveProductBtn">ذخیره</button>
      </div>
      <p class="modal-err" id="modalErr"></p>
    </form>
  </div>
</div>

<script src="api.js"></script>
<script>
  // -------------------- محافظت از صفحه: بدون توکن، برو صفحه‌ی ورود --------------------
  if (!getAdminToken()) { window.location.href = '13-admin-login.html'; }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    clearAdminToken();
    window.location.href = '13-admin-login.html';
  });

  // -------------------- تب‌ها --------------------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'orders') loadOrders();
if (btn.dataset.tab === 'settings') loadSiteSettings();
      if (btn.dataset.tab === 'messages') loadContactMessages();
    });
  });

  const fmt = n => Math.round(n).toLocaleString('fa-IR') + ' ت';
  const categoryNames = { kitchen:'ظروف و آشپزخانه', decor:'دکوراسیون', lighting:'نور و روشنایی', cleaning:'نظافت خانه' };

  // -------------------- محصولات: بارگذاری و نمایش --------------------
  async function loadProducts(){
    const wrap = document.getElementById('productsTableWrap');
    try {
      const res = await getProducts();
      const products = res.products || [];
      if (products.length === 0){
        wrap.innerHTML = '<p class="empty-state">هنوز محصولی ثبت نشده.</p>';
        return;
      }
      wrap.innerHTML = `
        <table>
          <thead><tr><th>نام</th><th>دسته‌بندی</th><th>قیمت</th><th>عملیات</th></tr></thead>
          <tbody>
            ${products.map(p => `
              <tr data-id="${p.id}">
                <td>${p.name}</td>
                <td>${categoryNames[p.category] || p.category}</td>
                <td class="price-cell"><strong>${fmt(p.price)}</strong>${p.oldPrice ? `<del>${fmt(p.oldPrice)}</del>` : ''}</td>
                <td>
                  <div class="row-actions">
                    <button class="icon-action edit-btn" title="ویرایش" data-id="${p.id}">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                    </button>
                    <button class="icon-action danger delete-btn" title="حذف" data-id="${p.id}">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                    </button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      wrap.innerHTML = `<p class="empty-state">اتصال به سرور برقرار نشد. مطمئن شو بک‌اند روی ${API_BASE} در حال اجراست.</p>`;
    }
  }

  // -------------------- مودال افزودن/ویرایش --------------------
  const modal = document.getElementById('productModal');
  const productForm = document.getElementById('productForm');
  const modalErr = document.getElementById('modalErr');
  let editingId = null;

let selectedImageFile = null;

  function openModal(product){
    modalErr.classList.remove('show');
    editingId = product ? product.id : null;
    selectedImageFile = null;
    document.getElementById('fImage').value = '';
    document.getElementById('modalTitle').textContent = product ? 'ویرایش محصول' : 'افزودن محصول جدید';
    document.getElementById('fName').value = product ? product.name : '';
    document.getElementById('fCategory').value = product ? product.category : 'kitchen';
    document.getElementById('fSubcategory').value = product ? (product.subcategory || '') : '';
    document.getElementById('fBrand').value = product ? (product.brand || '') : '';
    document.getElementById('fPrice').value = product ? product.price : '';
    document.getElementById('fOldPrice').value = product && product.oldPrice ? product.oldPrice : '';
    document.getElementById('fSpecs').value = product && product.specs ? Object.entries(product.specs).map(([k, v]) => `${k}: ${v}`).join('\n') : '';
    document.getElementById('fColors').value = product && product.options && product.options.colors
      ? product.options.colors.map(c => c.name).join(', ')
      : '';
    const preview = document.getElementById('imgPreview');
    if (product && product.images && product.images.length > 0) {
      preview.src = product.images[0];
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }
    modal.classList.add('show');
  }

  let selectedImageFiles = [];

  function renderPreviews(urls){
    document.getElementById('imgPreviewWrap').innerHTML = urls.map(u =>
      `<img src="${u}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;">`
    ).join('');
  }

  function openModal(product){
    modalErr.classList.remove('show');
    editingId = product ? product.id : null;
    selectedImageFiles = [];
    document.getElementById('fImage').value = '';
    document.getElementById('modalTitle').textContent = product ? 'ویرایش محصول' : 'افزودن محصول جدید';
    document.getElementById('fName').value = product ? product.name : '';
    document.getElementById('fCategory').value = product ? product.category : 'kitchen';
    document.getElementById('fSubcategory').value = product ? (product.subcategory || '') : '';
    document.getElementById('fBrand').value = product ? (product.brand || '') : '';
    document.getElementById('fPrice').value = product ? product.price : '';
    document.getElementById('fOldPrice').value = product && product.oldPrice ? product.oldPrice : '';
    document.getElementById('fDescription').value = product ? (product.description || '') : '';
    document.getElementById('fSpecs').value = product && product.specs ? Object.entries(product.specs).map(([k, v]) => `${k}: ${v}`).join('\n') : '';

    renderPreviews(product && product.images ? product.images : []);
    modal.classList.add('show');
  }

  document.getElementById('fImage').addEventListener('change', (e) => {
    selectedImageFiles = Array.from(e.target.files);
    renderPreviews(selectedImageFiles.map(f => URL.createObjectURL(f)));
  });
  function closeModal(){ modal.classList.remove('show'); }

  document.getElementById('openAddProduct').addEventListener('click', () => openModal(null));
  document.getElementById('cancelModal').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  document.getElementById('productsTableWrap').addEventListener('click', async (e) => {
    const editBtn = e.target.closest('.edit-btn');
    const delBtn = e.target.closest('.delete-btn');

    if (editBtn){
      const id = editBtn.dataset.id;
      const res = await getProducts();
      const product = (res.products || []).find(p => p.id === id);
      if (product) openModal(product);
    }

    if (delBtn){
      const id = delBtn.dataset.id;
      if (!confirm('مطمئنی می‌خوای این محصول حذف بشه؟')) return;
      try {
        await adminDeleteProduct(id);
        loadProducts();
      } catch (err) {
        alert(err.message || 'حذف محصول با خطا مواجه شد');
      }
    }
  });

  productForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    modalErr.classList.remove('show');

    const payload = {
      name: document.getElementById('fName').value.trim(),
      category: document.getElementById('fCategory').value,
      subcategory: document.getElementById('fSubcategory').value.trim(),
      brand: document.getElementById('fBrand').value.trim() || null,
      price: Number(document.getElementById('fPrice').value),
     description: document.getElementById('fDescription').value.trim(),
      oldPrice: document.getElementById('fOldPrice').value ? Number(document.getElementById('fOldPrice').value) : null,
      specs: Object.fromEntries(
        document.getElementById('fSpecs').value.split('\n')
          .map(line => line.split(':').map(s => s.trim()))
          .filter(parts => parts.length === 2 && parts[0])
      ),
     options: (() => {
        const colors = document.getElementById('fColors').value.split(',')
          .map(name => name.trim())
          .filter(name => name.length > 0)
          .map(name => ({ name, hex: colorNameToHex(name) }));
        return colors.length > 0 ? { colors } : null;
      })(),
    };

    const saveBtn = document.getElementById('saveProductBtn');
    saveBtn.disabled = true;

try {
      if (selectedImageFiles.length > 0) {
        saveBtn.textContent = 'در حال آپلود عکس‌ها...';
        payload.images = await adminUploadImages(selectedImageFiles);
      }
      saveBtn.textContent = 'در حال ذخیره...';
      if (editingId) {
        await adminUpdateProduct(editingId, payload);
      } else {
        await adminCreateProduct(payload);
      }
      closeModal();
      loadProducts();
    } catch (err) {
      modalErr.textContent = err.message || 'ذخیره‌سازی با خطا مواجه شد';
      modalErr.classList.add('show');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'ذخیره';
    }
  });

  // -------------------- سفارش‌ها --------------------
  const statusLabels = {pending:'در انتظار تایید', confirmed:'تایید شده', shipped:'ارسال شده', delivered:'تحویل داده شده', cancelled:'لغو شده'};

  async function loadOrders(){
    const wrap = document.getElementById('ordersTableWrap');
    wrap.innerHTML = '<p class="loading-state">در حال بارگذاری...</p>';
    try {
      const res = await adminGetOrders();
      const orders = res.orders || [];
      if (orders.length === 0){
        wrap.innerHTML = '<p class="empty-state">هنوز سفارشی ثبت نشده.</p>';
        return;
      }
      wrap.innerHTML = `
        <table>
          <thead><tr><th>شماره سفارش</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th></tr></thead>
          <tbody>
            ${orders.map(o => `
              <tr data-id="${o.id}">
                <td>${o.orderNumber}</td>
                <td>${o.customer.firstName} ${o.customer.lastName}<br><span style="color:var(--ink-soft);font-size:11.5px;">${o.customer.phone}</span></td>
                <td>${fmt(o.total)}</td>
                <td>
                  <select class="status-select" data-id="${o.id}">
                    ${Object.keys(statusLabels).map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${statusLabels[s]}</option>`).join('')}
                  </select>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      wrap.innerHTML = `<p class="empty-state">اتصال به سرور برقرار نشد یا دسترسی نداری.</p>`;
    }
  }

  document.getElementById('ordersTableWrap').addEventListener('change', async (e) => {
    if (!e.target.classList.contains('status-select')) return;
    const id = e.target.dataset.id;
    const newStatus = e.target.value;
    try {
      await adminUpdateOrderStatus(id, newStatus);
    } catch (err) {
      alert(err.message || 'تغییر وضعیت با خطا مواجه شد');
      loadOrders();
    }
  });

  // -------------------- شروع --------------------
  // -------------------- تنظیمات سایت (عکس هیرو) --------------------
  let selectedHeroFile = null;

  async function loadSiteSettings(){
    try {
      const settings = await getSettings();
      const preview = document.getElementById('heroPreview');
      if (settings.heroImage) {
        preview.src = settings.heroImage;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    } catch (err) { /* بی‌سروصدا رد شو */ }
  }

  document.getElementById('heroImageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    selectedHeroFile = file;
    const preview = document.getElementById('heroPreview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  });

  document.getElementById('saveHeroBtn').addEventListener('click', async () => {
    const msg = document.getElementById('heroSettingsMsg');
    const btn = document.getElementById('saveHeroBtn');
    if (!selectedHeroFile) {
      msg.textContent = 'اول یه عکس انتخاب کن';
      msg.style.color = '#FF6B81';
      msg.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'در حال آپلود...';
    try {
      const url = await adminUploadImage(selectedHeroFile);
      await adminUpdateSettings({ heroImage: url });
      msg.textContent = 'عکس هیرو با موفقیت ذخیره شد ✓';
      msg.style.color = 'var(--teal)';
      msg.style.display = 'block';
      selectedHeroFile = null;
    } catch (err) {
      msg.textContent = err.message || 'ذخیره‌سازی با خطا مواجه شد';
      msg.style.color = '#FF6B81';
      msg.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'ذخیره‌ی عکس هیرو';
    }
  });

  document.getElementById('removeHeroBtn').addEventListener('click', async () => {
    if (!confirm('عکس هیرو حذف بشه و به حالت پیش‌فرض برگرده؟')) return;
    try {
      await adminUpdateSettings({ heroImage: null });
      document.getElementById('heroPreview').style.display = 'none';
      const msg = document.getElementById('heroSettingsMsg');
      msg.textContent = 'عکس هیرو حذف شد ✓';
      msg.style.color = 'var(--teal)';
      msg.style.display = 'block';
    } catch (err) {
      alert(err.message || 'حذف با خطا مواجه شد');
    }
  });
  // -------------------- پیام‌های فرم تماس --------------------
  async function loadContactMessages(){
    const wrap = document.getElementById('messagesWrap');
    wrap.innerHTML = '<p class="loading-state">در حال بارگذاری...</p>';
    try {
      const { messages } = await adminGetContactMessages();
      if (messages.length === 0){
        wrap.innerHTML = '<p class="empty-state">پیامی ثبت نشده.</p>';
        return;
      }
      wrap.innerHTML = `
        <table>
          <thead><tr><th>نام</th><th>راه ارتباطی</th><th>پیام</th><th>تاریخ</th><th>وضعیت</th></tr></thead>
          <tbody>
            ${messages.map(m => `
              <tr data-id="${m.id}" style="${m.read ? 'opacity:0.55;' : ''}">
                <td>${m.name}</td>
                <td>${m.contact}</td>
                <td style="max-width:280px;white-space:normal;">${m.message}</td>
                <td style="font-size:11.5px;color:var(--ink-soft);">${new Date(m.createdAt).toLocaleDateString('fa-IR')}</td>
                <td>
                  ${m.read
                    ? '<span style="font-size:12px;color:var(--ink-soft);">خوانده‌شده</span>'
                    : `<button class="icon-action mark-read-btn" data-id="${m.id}" style="width:auto;padding:0 12px;font-size:11.5px;">علامت به‌عنوان خوانده‌شده</button>`
                  }
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      document.querySelectorAll('.mark-read-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await adminMarkMessageRead(btn.dataset.id);
            loadContactMessages();
          } catch (err) { alert(err.message || 'خطا رخ داد'); }
        });
      });
    } catch (err) {
      wrap.innerHTML = '<p class="empty-state">اتصال به سرور برقرار نشد.</p>';
    }
  }
  loadProducts();
</script>
</body>
</html>
