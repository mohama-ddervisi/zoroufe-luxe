<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سفارش‌های من | ZOROUFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6FB; --bg-soft:#FFFFFF; --ink:#2B2A33; --ink-soft:#6B6875;
    --violet:#8B6CF2; --blue:#4E9CFF; --teal:#3EE0C4;
    --glass:rgba(0,0,0,0.04); --glass-border:rgba(0,0,0,0.1);
    --line:rgba(0,0,0,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;position:relative;}
  a{text-decoration:none;color:inherit;} button{font-family:inherit;border:none;background:none;cursor:pointer;}

  .orb-field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.35;}
  .orb-1{width:440px;height:440px;background:radial-gradient(circle,var(--violet),transparent 70%);top:-12%;right:-10%;}
  .orb-2{width:380px;height:380px;background:radial-gradient(circle,var(--blue),transparent 70%);bottom:-12%;left:-10%;}

  header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);}
  .nav-wrap{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 40px;}
  .logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px;}
  .logo-dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:0 0 14px var(--violet);}
  .logo-text{display:flex;flex-direction:column;line-height:1;gap:3px;}
  .logo-main{font-size:19px;font-weight:800;letter-spacing:-0.01em;}
  .logo-sub{font-size:9px;font-weight:600;letter-spacing:0.32em;color:var(--ink-soft);}
  .back-link{font-size:13.5px;color:var(--ink-soft);}
  .back-link:hover{color:var(--ink);}
.logout-btn{font-size:13.5px;color:#FF6B81;font-weight:600;display:none;}
.logout-btn:hover{opacity:0.8;}
  .page-wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:56px 40px 100px;}
  .breadcrumb{font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
  .page-title{font-size:clamp(28px,4vw,38px);font-weight:800;letter-spacing:-0.02em;margin-bottom:36px;}

  .order-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:22px 24px;margin-bottom:16px;}
  .order-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .order-head strong{font-size:14.5px;font-weight:800;}
  .order-head span{font-size:12px;color:var(--ink-soft);}
  .status-badge{padding:5px 14px;border-radius:100px;font-size:12px;font-weight:700;}
  .status-pending{background:rgba(242,201,76,0.15);color:#F2C94C;}
  .status-confirmed{background:rgba(78,156,255,0.15);color:var(--blue);}
  .status-shipped{background:rgba(139,108,242,0.15);color:var(--violet);}
  .status-delivered{background:rgba(62,224,196,0.15);color:var(--teal);}
  .status-cancelled{background:rgba(255,107,129,0.15);color:#FF6B81;}
  .order-items{font-size:13px;color:var(--ink-soft);margin-bottom:12px;line-height:1.9;}
  .order-total{font-size:14px;font-weight:700;padding-top:12px;border-top:1px solid var(--line);}

  .empty-state{text-align:center;padding:80px 20px;color:var(--ink-soft);}
  .empty-state a{color:var(--blue);}
  .loading-state{text-align:center;padding:80px 20px;color:var(--ink-soft);}
  .login-needed{text-align:center;padding:80px 20px;color:var(--ink-soft);}
  .login-needed a{display:inline-block;margin-top:16px;padding:12px 28px;border-radius:100px;background:linear-gradient(100deg,var(--teal),var(--blue));color:#08080A;font-weight:800;font-size:13.5px;}

  @media(max-width:600px){ .page-wrap{padding:36px 20px 70px;} }
</style>
</head>
<body>

<div class="orb-field"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="logo"><span class="logo-dot"></span><span class="logo-text"><span class="logo-main">ZOROUFE</span><span class="logo-sub">LUXE</span></span></a>
       <button id="logoutBtn" class="logout-btn">خروج از حساب</button>
  </div>
</header>

<div class="page-wrap">
  <div class="breadcrumb"><a href="index.html">خانه</a> / سفارش‌های من</div>
  <h1 class="page-title">سفارش‌های من</h1>
  <div id="ordersWrap"><p class="loading-state">در حال بارگذاری...</p></div>
</div>

<script src="api.js"></script>
<script>
  const statusLabels = {pending:'در انتظار تایید', confirmed:'تایید شده', shipped:'ارسال شده', delivered:'تحویل داده شده', cancelled:'لغو شده'};
  const fmtFa = n => Math.round(n).toLocaleString('fa-IR') + ' ت';
  const wrap = document.getElementById('ordersWrap');
  if (isLoggedIn()) {
    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.style.display = 'inline-block';
    logoutBtn.addEventListener('click', userLogout);
  }
  async function loadMyOrders(){
    if (!isLoggedIn()) {
      wrap.innerHTML = `
        <div class="login-needed">
          <p>برای دیدن سفارش‌هات، اول باید وارد حسابت بشی.</p>
          <a href="15-login.html">ورود به حساب</a>
        </div>`;
      return;
    }

    try {
      const { orders } = await getMyOrders();
      if (orders.length === 0) {
        wrap.innerHTML = `<div class="empty-state">هنوز سفارشی ثبت نکردی. <a href="04-product-listing.html">برو خرید کن</a></div>`;
        return;
      }

      wrap.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-head">
            <div><strong>سفارش ${o.orderNumber}</strong> <span>— ${new Date(o.createdAt).toLocaleDateString('fa-IR')}</span></div>
            <span class="status-badge status-${o.status}">${statusLabels[o.status] || o.status}</span>
          </div>
          <div class="order-items">${o.items.map(i => `${i.name} × ${i.qty.toLocaleString('fa-IR')}`).join('، ')}</div>
          <div class="order-total">مبلغ نهایی: ${fmtFa(o.total)}</div>
        </div>
      `).join('');
    } catch (err) {
      wrap.innerHTML = `<p class="loading-state">اتصال به سرور برقرار نشد.</p>`;
    }
  }

  loadMyOrders();
</script>
</body>
</html>
